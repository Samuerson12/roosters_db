[theme]
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
headingFontSizes = ["2.3rem", "1.5rem", "1.12rem", "1rem", "0.95rem", "0.9rem"]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
metricValueFontWeight = 700

[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2328"
borderColor = "#E3E2DC"
dataframeHeaderBackgroundColor = "#F1F0EC"

[theme.light.sidebar]
backgroundColor = "#14171C"
secondaryBackgroundColor = "#1E232A"
textColor = "#E8E6E1"
borderColor = "#2A3038"

[theme.dark]
primaryColor = "#EA6A2A"
backgroundColor = "#121417"
secondaryBackgroundColor = "#1B1F24"
textColor = "#ECEAE5"
borderColor = "#2C3138"
dataframeHeaderBackgroundColor = "#20252B"

[theme.dark.sidebar]
backgroundColor = "#0C0E11"
secondaryBackgroundColor = "#181B20"
textColor = "#E8E6E1"
borderColor = "#22262C"
